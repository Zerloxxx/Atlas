name: MovieAssistant
options:
  bundleIdPrefix: com.moviassistant
  deploymentTarget:
    iOS: "18.0"
configs:
  Debug: debug
  Release: release
targets:
  MovieAssistant:
    type: application
    platform: iOS
    sources:
      - path: MovieAssistant
        excludes:
          - "**/*.example.swift"
    info:
      path: MovieAssistant/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: MovieAssistant
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # iOS 26 рисует таб-бар "жидким стеклом" и игнорирует наши цвета.
        # Этот ключ возвращает классический непрозрачный вид, где UITabBarAppearance работает.
        UIDesignRequiresCompatibility: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moviassistant.app
        DEVELOPMENT_TEAM: 8F8MKLX3YV
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
